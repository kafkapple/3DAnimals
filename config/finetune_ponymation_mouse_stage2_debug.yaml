# Ponymation Mouse Stage 2 Fine-tuning Debug Mode
#
# Quick validation of Stage 2 Motion VAE training (~15-20 minutes)
#
# Prerequisites:
#   - Stage 1 checkpoint at results/ponymation/mouse_finetune_stage1_debug/
#   - Run Stage 1 first: ./scripts/train_unified.sh ponymation-s1 debug finetune
#
# Usage:
#   python run.py --config-name finetune_ponymation_mouse_stage2_debug
#
# Note: checkpoint_path is auto-detected by train_unified.sh from Stage 1 directory
#       Use STAGE1_CHECKPOINT env var or override via command line if needed

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: sequence
  - model: ponymation  # Use original ponymation model (not ponymation_mouse)


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 2  # Debug: 작은 배치
  num_frames: 10
  train_data_dir: data/ponymation/mouse/train
  val_data_dir: data/ponymation/mouse/test
  random_shuffle_samples_train: true
  load_dino_feature: false
  dino_feature_dim: 16


model:
  enable_render: false
  cfg_predictor_base:
    cfg_shape:
      grid_res_coarse_iter_range: [0, inf]
  cfg_predictor_instance:
    enable_motion_vae: true
    enable_deform: true
  cfg_loss:
    mask_loss_weight: 0.
    mask_dt_loss_weight: 0.
    mask_inv_dt_loss_weight: 0.
    rgb_loss_weight: 0.
    dino_feat_im_loss_weight: 0.
    logit_loss_weight: 0.
    sdf_bce_reg_loss_weight: 0.
    sdf_gradient_reg_loss_weight: 0.
    arti_reg_loss_weight: 0.
    deform_reg_loss_weight: 0.
    artivel_smooth_loss_weight: 0.
    arti_recon_loss_weight: 100.0
    kld_loss_weight: 0.001


run_train: true
run_test: false
seed: 42
gpu: 1
disable_tf32: true
num_iters: 3000  # Debug: 3K iterations
save_checkpoint_freq: 1000
log_image_freq: 100
log_loss_freq: 20

# Stage 2 saves results here
checkpoint_dir: results/ponymation/mouse_finetune_stage2_debug
# checkpoint_path: set via train_unified.sh or command line override
# e.g., checkpoint_path=results/ponymation/mouse_finetune_stage1_debug/checkpoint2000.pth
resume: true
reset_epoch: true  # Reset iteration counter for Stage 2
load_optim: false

use_logger: true
logger_type: wandb
wandb_project: Ponymation_mouse
wandb_run_name: stage2_finetune_debug_${now:%Y%m%d_%H%M%S}
mixed_precision: fp16
