# Mouse Training Configuration
# Auto-generated by prepare_fauna_dataset.py
# Duration: ~2-3 hours (50K iterations)

defaults:
- dataset: mouse
- model: mouse
- _self_
exp_name: mouse_50k
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}
num_iters: 50000
save_checkpoint_freq: 5000
log_image_freq: 500
device: cuda
gpu_ids:
- 0
disable_tf32: true
wandb:
  project: mouse_fauna
  mode: online
  tags:
  - mouse
  - fauna
  - 50k
output_dir: results/${exp_name}
resume: null
seed: 42
run_train: true
run_test: false
keep_num_checkpoint: 5
