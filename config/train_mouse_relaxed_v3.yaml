# Mouse Relaxed V3 Training Configuration (AGGRESSIVE)
# Testing spatial_scale=3.0 + most relaxed constraints

defaults:
- dataset: mouse
- model: mouse_relaxed_v3
- _self_

exp_name: mouse_relaxed_v3
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}

num_iters: 200
save_checkpoint_freq: 50
log_image_freq: 20

device: cuda
gpu_ids:
- 0
disable_tf32: true

wandb:
  project: mouse_fauna
  mode: offline
  tags:
  - mouse
  - relaxed_v3_aggressive
  - spatial_scale_3.0

output_dir: results/${exp_name}
resume: null
seed: 42

run_train: true
run_test: false
keep_num_checkpoint: 5
