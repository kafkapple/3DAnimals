# MagicPony Training Configuration - A6000 From Scratch
#
# MagicPony (CVPR 2023) original training setup:
# - 140K iterations for pretrained model from scratch
# - A6000 (48GB VRAM) enables identical settings
#
# This config: FROM SCRATCH training (longer but potentially better for novel species)
# For fine-tuning, use train_magicpony_mouse_a6000.yaml (recommended)
#
# Expected training time: ~2-3 days on A6000 (140K iterations)
#
# Usage:
#   python run.py --config-name train_magicpony_mouse_scratch_a6000 gpu=0

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: image
  - model: magicpony_mouse_a6000


# Dataset settings
dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 8  # A6000 can handle larger batch
  train_data_dir: data/magicpony/mouse/train
  val_data_dir: data/magicpony/mouse/val
  random_shuffle_samples_train: true
  load_dino_feature: false
  dino_feature_dim: 16


# Training settings - FROM SCRATCH (140K like original paper)
run_train: true
run_test: true
seed: 42
gpu: 0
disable_tf32: false
num_iters: 140000  # Original paper: 140K for pretrained model

# Checkpoint settings - No pretrained model
checkpoint_dir: results/magicpony/mouse_scratch_a6000
resume: true

# Checkpoint saving
save_checkpoint_freq: 5000
keep_num_checkpoint: 5

# Visualization
save_train_result_freq: 10000

# Logging - WandB
use_logger: true
logger_type: wandb
wandb_project: MagicPony_mouse_a6000
wandb_run_name: scratch_140k_${now:%Y%m%d_%H%M%S}
log_image_freq: 1000
log_loss_freq: 100
