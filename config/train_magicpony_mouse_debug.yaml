hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: image
  - model: magicpony_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 2  # 메모리 최적화: 5 -> 2
  train_data_dir: data/magicpony/mouse/train
  val_data_dir: data/magicpony/mouse/val
  random_shuffle_samples_train: true
  load_dino_feature: false  # DINO features not pre-extracted
  dino_feature_dim: 16


run_train: true
run_test: false
seed: 0
gpu: 0
num_iters: 5000
save_checkpoint_freq: 1000
log_image_freq: 100
checkpoint_dir: results/magicpony/mouse_debug
resume: false
use_logger: true
logger_type: wandb
wandb_project: MagicPony_mouse
wandb_run_name: scratch_debug_${now:%Y%m%d_%H%M%S}
