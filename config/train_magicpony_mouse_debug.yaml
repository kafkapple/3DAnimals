hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: image
  - model: magicpony_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 5
  train_data_dir: data/magicpony/mouse/train
  val_data_dir: data/magicpony/mouse/val
  random_shuffle_samples_train: true
  load_dino_feature: true
  dino_feature_dim: 16


run_train: true
run_test: false
seed: 0
gpu: 1
num_iters: 5000
save_checkpoint_freq: 1000
log_image_freq: 100
checkpoint_dir: results/magicpony/mouse_debug
resume: false
use_logger: false
