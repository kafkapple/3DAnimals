# MagicPony Mouse Fine-tuning from Pretrained Horse
#
# Fine-tune pretrained horse model on mouse dataset
# Horse is recommended as base model due to similar quadruped structure
#
# Prerequisites:
#   1. Download pretrained horse model:
#      cd results/magicpony && bash download_pretrained_magicpony.sh
#   2. Prepare mouse data:
#      python scripts/convert_fauna_to_magicpony.py \
#          --source data/fauna_mouse/large_scale/mouse_dannce_6view \
#          --target data/magicpony/mouse --copy
#
# Usage:
#   python run.py --config-name finetune_magicpony_mouse

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: image
  - model: magicpony_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 4  # 메모리 최적화
  train_data_dir: data/magicpony/mouse/train
  val_data_dir: data/magicpony/mouse/val
  random_shuffle_samples_train: true
  load_dino_feature: false  # DINO 특징 미생성
  dino_feature_dim: 16


# Fine-tuning specific: 더 늦게 deformation 활성화
model:
  cfg_predictor_instance:
    cfg_deform:
      deform_iter_range: [80000, inf]  # Fine-tune 시 더 늦게
    cfg_articulation:
      articulation_iter_range: [20000, inf]  # Fine-tune 시 더 빨리


run_train: true
run_test: false
seed: 42
gpu: 0
num_iters: 100000  # Fine-tuning: 100K (from scratch 보다 적음)
save_checkpoint_freq: 2000
keep_num_checkpoint: 3

# CRITICAL: Pretrained horse model path
checkpoint_dir: results/magicpony/mouse_finetune
checkpoint_path: results/magicpony/pretrained_horse/pretrained_horse.pth
resume: true
reset_epoch: true  # Reset iteration counter (pretrained has 140K iters)
load_optim: false  # Don't load optimizer state from horse

# Logging
use_logger: true
logger_type: wandb
wandb_project: MagicPony_mouse
wandb_run_name: finetune_${now:%Y%m%d_%H%M%S}
log_image_freq: 500
log_loss_freq: 50
