# Debug Configuration for Mouse 6-view Experiment
#
# Quick validation (5K iterations, ~15-30 min) before full training

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base_fauna
  - dataset: mouse_6view_posesplatter
  - model: fauna_mouse_6view


# Dataset settings
dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 2  # Reduced from 6 for GPU memory
  train_data_dir: data/fauna/mouse_6view_posesplatter
  val_data_dir: data/fauna/mouse_6view_posesplatter  # Use same data for val (6-view experiment)
  test_data_dir: data/fauna/mouse_6view_posesplatter
  random_shuffle_samples_train: false
  load_dino_feature: false
  dino_feature_dim: 16
  random_xflip_train: false

# Model settings - following original Fauna paper settings
# Note: With proper crop preprocessing, original settings should work
model:
  cfg_predictor_base:
    cfg_shape:
      grid_res: 64  # Fauna default (128), reduced for GPU memory
      grid_res_coarse: 32
      grid_res_coarse_iter_range: [0, 2000]  # Progressive training
  cfg_loss:
    # Original Fauna values (with crop preprocessing these should work)
    sdf_gradient_reg_loss_weight: 0.1  # Fauna default
    mask_loss_weight: 100.0  # Fauna default
    mask_inv_dt_loss_weight: 1000.0  # Fauna default


# Debug training settings
run_train: true
run_test: true  # Run test after training to save mesh visualizations
seed: 42
gpu: 0
num_iters: 5000  # Short debug run

# Checkpoint settings
checkpoint_dir: results/fauna_mouse_6view_debug
save_checkpoint_freq: 1000
keep_num_checkpoint: 5
resume: false  # Start fresh for debug

# Visualization - save mesh/images during training
save_train_result_freq: 1000  # Save mesh every 1K iterations for debug

# Logging - WandB enabled
use_logger: true
logger_type: wandb
log_image_freq: 100  # More frequent for debug
log_loss_freq: 10
