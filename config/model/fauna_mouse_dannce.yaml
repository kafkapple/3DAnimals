# Fauna Model Configuration for Mouse DANNCE
#
# Animal: Mouse (small quadruped)
# Dataset: Few-shot (50 frames total)
# GPU Target: RTX 3060 12GB

defaults:
  - fauna  # Inherit base fauna configuration

# Model name
name: Fauna  # Must be "Fauna" to match model registry

# ==============================================================================
# Base Predictor Configuration
# ==============================================================================

cfg_predictor_base:

  # ============================================================================
  # Shape Configuration (SDF Learning)
  # ============================================================================
  cfg_shape:
    # Grid resolution (optimized for RTX 3060 12GB)
    grid_res: 64                            # Low res for GPU memory (128 causes OOM)
    grid_res_coarse_iter_range: [0, 30000] # Use coarse until 30K (shorter training)
    grid_res_coarse: 32                     # Very low res initially

    # Spatial scale (small animal)
    spatial_scale: 4.5  # Small scene for mouse (4-5 range)

    # MLP architecture (smaller for limited data)
    num_layers: 5       # Standard depth
    hidden_size: 128    # Smaller hidden size (64-128 for small animals)

    # Positional encoding
    embedder_freq: 8
    embed_concat_pts: true

    # Shape initialization
    init_sdf: ellipsoid # Start from ellipsoid (good for quadrupeds)
    pretrained_sdf: null  # Train from scratch

    jitter_grid: 0.05
    symmetrize: true    # Bilateral symmetry for mouse

  # ============================================================================
  # DINO Feature Configuration
  # ============================================================================
  cfg_dino:
    feature_dim: 16
    num_layers: 5
    hidden_size: 128    # Match shape hidden size
    activation: sigmoid
    embedder_freq: 8
    embed_concat_pts: true
    symmetrize: false
    minmax: [0., 1.]

  # ============================================================================
  # Memory Bank Configuration
  # ============================================================================
  cfg_bank:
    memory_bank_size: 50  # Match total dataset size (5 sequences × 10 frames)

# ==============================================================================
# Instance Predictor Configuration
# ==============================================================================

cfg_predictor_instance:
  spatial_scale: ${..cfg_render.spatial_scale}

  # ============================================================================
  # Image Encoder
  # ============================================================================
  cfg_encoder:
    cout: 256
    which_vit: dino_vits8
    pretrained: true
    frozen: true
    final_layer_type: conv

  # ============================================================================
  # Texture Configuration
  # ============================================================================
  cfg_texture:
    texture_iter_range: [0, inf]  # Enable from start

    cout: 9
    num_layers: 8
    hidden_size: 128              # Smaller for mouse
    activation: sigmoid
    kd_minmax: [[0., 1.], [0., 1.], [0., 1.]]
    embed_concat_pts: true
    embedder_freq: 10
    symmetrize: true

  # ============================================================================
  # Pose Estimation
  # ============================================================================
  cfg_pose:
    architecture: encoder_dino_patch_key
    cam_pos_z_offset: ${...cfg_render.cam_pos_z_offset}
    fov: ${...cfg_render.fov}

    # Translation constraints
    max_trans_xy_range_ratio: 0.2
    max_trans_z_range_ratio: 0.5

    # Rotation representation
    rot_rep: quadlookat
    rot_temp_scalar: 1

    # Training schedule
    naive_probs_iter: 2000
    best_pose_start_iter: 6000
    lookat_zeroy: true

  # ============================================================================
  # Deformation (Non-rigid shape variation)
  # ============================================================================
  enable_deform: false  # Disable for few-shot (not enough data)
  cfg_deform:
    deform_iter_range: [800000, inf]  # Very late (won't reach in few-shot)
    num_layers: 5
    hidden_size: 128
    embed_concat_pts: true
    embedder_freq: 10
    symmetrize: true

  # ============================================================================
  # Articulation (Skeletal motion)
  # ============================================================================
  enable_articulation: true
  cfg_articulation:
    articulation_iter_range: [10000, inf]  # Enable early (10K instead of 20K)

    architecture: attention  # Better quality

    num_layers: 4
    hidden_size: 128         # Smaller for mouse
    embedder_freq: 8

    bone_feature_mode: sample+global

    # Skeleton structure (SMALL ANIMAL - MOUSE)
    num_body_bones: 6        # Small spine (must be EVEN - 4, 6, or 8)
    body_bones_mode: z_minmax_y+

    num_legs: 4              # Quadruped
    num_leg_bones: 3         # Standard

    # Leg attachment
    attach_legs_to_body_iter_range: [30000, inf]  # Earlier (30K instead of 60K)
    legs_to_body_joint_indices: null  # Auto-detect

    static_root_bones: false
    skinning_temperature: 0.05

    max_arti_angle: 60
    constrain_legs: false
    output_multiplier: 0.1
    enable_refine: false

  # ============================================================================
  # Lighting
  # ============================================================================
  enable_lighting: true
  cfg_light:
    num_layers: 5
    hidden_size: 128
    amb_diff_minmax: [[0.0, 1.0], [0.5, 1.0]]

  # ============================================================================
  # Additional Settings
  # ============================================================================
  cfg_additional:
    iter_leg_rotation_start: 150000  # Won't reach in few-shot

# ==============================================================================
# Rendering Configuration
# ==============================================================================
cfg_render:
  spatial_scale: 4.5      # Match cfg_predictor_base.cfg_shape
  background_mode: none
  render_flow: false
  cam_pos_z_offset: 10
  fov: 25
  renderer_spp: 1

# ==============================================================================
# Loss Configuration
# ==============================================================================
cfg_loss:
  # Mask losses
  mask_loss_weight: 100.0
  mask_dt_loss_weight: 0.
  mask_inv_dt_loss_weight: 1000.0

  # RGB loss
  rgb_loss_weight: 1.0

  # DINO feature loss
  dino_feat_im_loss_weight: 10.0

  # SDF regularization
  sdf_reg_decay_start_iter: 5000    # Earlier decay for few-shot
  sdf_bce_reg_loss_weight: 0.
  sdf_gradient_reg_loss_weight: 0.1

  # Viewpoint selection
  logit_loss_weight: 1.0
  logit_loss_dino_feat_im_loss_multiplier: 50.0

  # Articulation regularization
  arti_reg_loss_iter_range: [30000, inf]  # Match attach_legs timing
  arti_reg_loss_weight: 0.2

  # Deformation regularization
  deform_reg_loss_weight: 10.0

  # Fauna-specific (few-shot training - simpler schedule)
  logit_loss_dino_feat_im_loss_multiplier_dict: {0: 50., 30000: 500.}
  dino_feat_im_loss_weight_dict: {0: 10., 30000: 1.}
  logit_loss_mask_multiplier: 0.05
  logit_loss_mask_inv_dt_multiplier: 0.05

# ==============================================================================
# Notes
# ==============================================================================
# - Optimized for few-shot dataset (50 frames)
# - Small animal (mouse): spatial_scale=4.5, grid_res=64
# - RTX 3060 12GB friendly: grid_res=64, hidden_size=128, batch_size=2
# - Shorter iteration schedule due to limited data
# - Deformation disabled (not enough data)
# - Articulation enabled early (10K) for better pose learning
