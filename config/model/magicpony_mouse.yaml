# MagicPony Mouse - Ultra-Stabilized Configuration
# Mesh collapse 방지를 위한 매우 보수적인 설정

defaults:
  - magicpony

name: MagicPony

# Shape network - coarse resolution 유지
cfg_predictor_base:
  cfg_shape:
    grid_res: 64
    grid_res_coarse_iter_range: [0, inf]  # 항상 coarse 유지
    grid_res_coarse: 32
    jitter_grid: 0.01  # 매우 작게
    spatial_scale: 5.0

# Articulation/Deformation 완전히 비활성화 (초기 학습)
cfg_predictor_instance:
  enable_deform: false
  cfg_deform:
    deform_iter_range: [500000, inf]  # 사실상 비활성화
  cfg_articulation:
    articulation_iter_range: [100000, inf]  # 매우 늦게
    num_body_bones: 6  # mouse용 (horse: 8)
    num_legs: 4
    num_leg_bones: 3
    legs_to_body_joint_indices: [1, 5, 5, 1]  # mouse용
    extra_constraints: false

# Loss Configuration - SDF 안정성 최우선
cfg_loss:
  # Mask losses
  mask_loss_weight: 100.0  # 강화
  mask_dt_loss_weight: 1.0
  mask_inv_dt_loss_weight: 1000.0  # 강화

  # SDF regularization - 최대 강화
  sdf_reg_decay_start_iter: 500000  # decay 없음
  sdf_bce_reg_loss_weight: 10.0  # 대폭 강화
  sdf_gradient_reg_loss_weight: 10.0  # 대폭 강화

  # 기타
  rgb_loss_weight: 1.0
  dino_feat_im_loss_weight: 5.0
  logit_loss_weight: 0.1  # 낮춤

# 매우 낮은 Learning Rate
cfg_optim_base:
  lr: 0.00001  # 매우 낮게

cfg_optim_instance:
  lr: 0.00001
