# MagicPony Mouse - Stabilized Configuration
# 강화된 SDF regularization으로 mesh collapse 방지

defaults:
  - magicpony

name: MagicPony

# Shape network - 더 보수적인 설정
cfg_predictor_base:
  cfg_shape:
    grid_res: 128
    grid_res_coarse_iter_range: [0, 50000]  # 더 오래 coarse 유지
    grid_res_coarse: 64
    jitter_grid: 0.02  # 더 작게 (안정성)

# Articulation/Deformation 늦게 시작
cfg_predictor_instance:
  enable_deform: false  # 비활성화
  cfg_deform:
    deform_iter_range: [200000, inf]
  cfg_articulation:
    articulation_iter_range: [50000, inf]  # 더 늦게

# 강화된 Loss Configuration
cfg_loss:
  # Mask losses - 강화
  mask_loss_weight: 50.0
  mask_inv_dt_loss_weight: 500.0

  # SDF regularization - 핵심! 대폭 강화
  sdf_reg_decay_start_iter: 100000
  sdf_bce_reg_loss_weight: 5.0    # 0 → 5 (collapse 방지)
  sdf_gradient_reg_loss_weight: 5.0  # 0.01 → 5 (500배 강화)

  # 기타
  dino_feat_im_loss_weight: 5.0
  logit_loss_weight: 0.5

# 낮은 Learning Rate
cfg_optim_base:
  lr: 0.00005  # 0.0001 → 0.00005

cfg_optim_instance:
  lr: 0.00005
