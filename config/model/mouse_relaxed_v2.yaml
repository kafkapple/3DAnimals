# Mouse-Optimized Relaxed Configuration V2
# Added: Smaller spatial_scale for better detail representation
# Goal: Extend training beyond 30 iterations

defaults:
- fauna
name: Fauna

cfg_predictor_base:
  cfg_shape:
    grid_res: 32  # Keep for memory safety
    grid_res_coarse_iter_range:
    - 0
    - 100000
    grid_res_coarse: 32
    spatial_scale: 3.5  # 🔧 NEW: Reduced from 4.0 to 3.5 (finer representation)
    num_layers: 5
    hidden_size: 64  # Proven optimal
    embedder_freq: 8
    embed_concat_pts: true
    init_sdf: ellipsoid
    pretrained_sdf: ${oc.env:PWD}/checkpoints/mouse_sdf_pretrained.pth
    jitter_grid: 0.05
    symmetrize: false  # 🔧 CHANGE 1: Remove symmetry (multi-view provides enough constraint)

cfg_predictor_instance:
  enable_articulation: true
  cfg_articulation:
    articulation_iter_range:
    - 20000  # 🔧 CHANGE 2: Start later for stability (was 10000)
    - inf
    num_body_bones: 4  # 🔧 CHANGE 3: Simplify skeleton (was 6)
    num_legs: 4
    num_leg_bones: 3
    attach_legs_to_body_iter_range:
    - 40000  # 🔧 CHANGE 4: Attach later (was 30000)
    - inf
  enable_deform: false

cfg_render:
  spatial_scale: 3.5  # 🔧 NEW: Match cfg_shape.spatial_scale
  cam_pos_z_offset: 10  # Keep standard
  fov: 25  # Keep standard

# Loss Configuration - Relaxed for mouse-only training
cfg_loss:
  # Mask losses
  mask_loss_weight: 100.0
  mask_dt_loss_weight: 0.
  mask_inv_dt_loss_weight: 500.0  # 🔧 CHANGE 5: Reduced from 1000.0

  # RGB loss
  rgb_loss_weight: 1.0

  # DINO feature loss
  dino_feat_im_loss_weight: 10.0

  # SDF regularization - RELAXED!
  sdf_reg_decay_start_iter: 10000
  sdf_bce_reg_loss_weight: 0.
  sdf_gradient_reg_loss_weight: 0.05  # 🔧 CHANGE 6: RELAXED from 0.1 (KEY CHANGE!)

  # Viewpoint selection
  logit_loss_weight: 1.0
  logit_loss_dino_feat_im_loss_multiplier: 50.0

  # Articulation regularization
  arti_reg_loss_iter_range: [60000, inf]
  arti_reg_loss_weight: 0.2

  # Deformation regularization
  deform_reg_loss_weight: 10.0

  # Fauna-specific (for multi-view large-scale training)
  logit_loss_dino_feat_im_loss_multiplier_dict: {0: 50., 150000: 500.}
  dino_feat_im_loss_weight_dict: {0: 10., 150000: 1.}
  logit_loss_mask_multiplier: 0.05
  logit_loss_mask_inv_dt_multiplier: 0.05

# Optimizer Configuration
cfg_optim_base:
  lr: 0.001
  weight_decay: 0.

# ==============================================================================
# Changes Summary (V2: Added Spatial Scale Optimization)
# ==============================================================================
# 0. spatial_scale: 4.0 → 3.5 (NEW: finer scene representation)
#    - Grid fineness: 0.125 → 0.109 units/grid (13% improvement)
#    - Better detail capture for small mouse body parts
#    - Still fits mouse comfortably (15cm mouse in 35cm³ scene)
#
# 1. symmetrize: true → false (remove unnecessary constraint)
# 2. articulation_iter_range: [10000, inf] → [20000, inf] (start later)
# 3. num_body_bones: 6 → 4 (simplify skeleton)
# 4. attach_legs_to_body_iter_range: [30000, inf] → [40000, inf] (attach later)
# 5. mask_inv_dt_loss_weight: 1000.0 → 500.0 (reduce pressure)
# 6. sdf_gradient_reg_loss_weight: 0.1 → 0.05 (KEY: relax Eikonal constraint)
#
# Spatial Scale Analysis:
# ┌──────────────┬──────────┬────────────┬───────────────┐
# │ Config       │ Scale    │ Grid (32)  │ Fineness      │
# ├──────────────┼──────────┼────────────┼───────────────┤
# │ Original     │ 5.0      │ 0.156 u/g  │ Coarse        │
# │ DANNCE       │ 4.5 (64) │ 0.070 u/g  │ Very Fine     │
# │ Markerless   │ 4.0      │ 0.125 u/g  │ Medium        │
# │ V1 (relaxed) │ 4.0      │ 0.125 u/g  │ Medium        │
# │ V2 (this)    │ 3.5      │ 0.109 u/g  │ Fine ✨       │
# └──────────────┴──────────┴────────────┴───────────────┘
#
# Expected Results:
# - V1 (scale=4.0, reg=0.05): T000050-70 expected
# - V2 (scale=3.5, reg=0.05): T000060-80 expected (finer detail + relaxed constraint)
#
# Trade-offs:
# - ✅ Finer spatial resolution (13% improvement)
# - ✅ Better small-scale detail capture
# - ✅ More appropriate for mouse scale
# - ⚠️ Potential pretrained SDF scale mismatch (4.0→3.5)
# - ⚠️ Tighter scene (35cm³ vs 40cm³) but still sufficient
# ==============================================================================
