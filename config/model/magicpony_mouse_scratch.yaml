# MagicPony Mouse - From Scratch Configuration
# Horse prior 없이 mouse 데이터만으로 학습

defaults:
  - magicpony

name: MagicPony

# Shape network - 표준 설정
cfg_predictor_base:
  cfg_shape:
    grid_res: 64
    grid_res_coarse_iter_range: [0, 10000]
    grid_res_coarse: 32
    jitter_grid: 0.05
    spatial_scale: 5.0

# Articulation - 적절한 시점에 활성화
cfg_predictor_instance:
  enable_deform: false
  cfg_deform:
    deform_iter_range: [50000, inf]
  cfg_articulation:
    articulation_iter_range: [10000, inf]

# Loss Configuration - 표준
cfg_loss:
  mask_loss_weight: 50.0
  mask_dt_loss_weight: 1.0
  mask_inv_dt_loss_weight: 500.0
  rgb_loss_weight: 1.0
  dino_feat_im_loss_weight: 5.0
  logit_loss_weight: 0.5
  sdf_bce_reg_loss_weight: 1.0
  sdf_gradient_reg_loss_weight: 1.0

# 표준 Learning Rate
cfg_optim_base:
  lr: 0.0001

cfg_optim_instance:
  lr: 0.0001
