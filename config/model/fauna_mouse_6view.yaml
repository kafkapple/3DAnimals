# Fauna Model Configuration for Mouse 6-view Experiment
#
# Based on original Fauna default hyperparameters as specified in Pose Splatter paper:
# "trained using their prescribed data preprocessing pipelines and hyperparameters"
#
# Key settings for small animal (mouse):
# - spatial_scale: reduced for mouse size
# - grid_res: 128 (standard Fauna)
# - All other hyperparameters: Fauna defaults

defaults:
  - dataset: ../../dataset/mouse_6view_posesplatter

name: Fauna
dataset: ${dataset}

## Optimizer - Fauna defaults
cfg_optim_base:
  lr: 0.001
  weight_decay: 0.

cfg_optim_instance:
  lr: 0.0001
  weight_decay: 0.

cfg_optim_discriminator:
  lr: 0.0001
  weight_decay: 0.


## Rendering - adjusted spatial_scale for mouse
cfg_render:
  spatial_scale: 5.0  # Reduced from 7 for smaller animal (mouse ~5-10cm)
  background_mode: none
  render_flow: false
  cam_pos_z_offset: 10
  fov: 25
  renderer_spp: 1

# Mask discriminator - Fauna default, helps prevent collapse
cfg_mask_discriminator:
  enable_iter: [80000, 300000]


## Base predictor - reduced grid_res for limited GPU memory
cfg_predictor_base:
  cfg_shape:
    grid_res: 64  # Reduced from 128 due to GPU memory constraints
    grid_res_coarse_iter_range: [0, 500000]
    grid_res_coarse: 32
    spatial_scale: ${...cfg_render.spatial_scale}
    num_layers: 5
    hidden_size: 256
    embedder_freq: 8
    embed_concat_pts: true
    init_sdf: ellipsoid
    pretrained_sdf: null
    jitter_grid: 0.05
    symmetrize: true

  cfg_dino:
    feature_dim: 16
    num_layers: 5
    hidden_size: 256
    activation: sigmoid
    embedder_freq: 8
    embed_concat_pts: true
    symmetrize: false
    minmax: [0., 1.]

  cfg_bank:
    memory_bank_size: 60  # SBSM bank size - Fauna default


## Instance predictor - Fauna defaults
cfg_predictor_instance:
  spatial_scale: ${..cfg_render.spatial_scale}

  cfg_encoder:
    cout: 256
    which_vit: dino_vits8
    pretrained: true
    frozen: true
    final_layer_type: conv

  cfg_texture:
    texture_iter_range: [0, inf]
    cout: 9
    num_layers: 8
    hidden_size: 256
    activation: sigmoid
    kd_minmax: [[0., 1.], [0., 1.], [0., 1.]]
    embed_concat_pts: true
    embedder_freq: 10
    symmetrize: true

  cfg_pose:
    architecture: encoder_dino_patch_key
    cam_pos_z_offset: ${...cfg_render.cam_pos_z_offset}
    fov: ${...cfg_render.fov}
    max_trans_xy_range_ratio: 0.2
    max_trans_z_range_ratio: 0.5
    rot_rep: quadlookat
    rot_temp_scalar: 1
    naive_probs_iter: 2000
    best_pose_start_iter: 6000
    lookat_zeroy: true

  enable_deform: true
  cfg_deform:
    deform_iter_range: [800000, inf]  # Deformation disabled for this short experiment
    num_layers: 5
    hidden_size: 256
    embed_concat_pts: true
    embedder_freq: 10
    symmetrize: true

  enable_articulation: true
  cfg_articulation:
    articulation_iter_range: [20000, inf]  # Articulation starts at 20K
    architecture: attention
    num_layers: 4
    hidden_size: 256
    embedder_freq: 8
    bone_feature_mode: sample+global
    num_body_bones: 6  # Reduced for mouse (smaller animal)
    body_bones_mode: z_minmax_y+
    num_legs: 4
    num_leg_bones: 3
    attach_legs_to_body_iter_range: [60000, inf]
    legs_to_body_joint_indices: null
    static_root_bones: false
    skinning_temperature: 0.05
    max_arti_angle: 60
    constrain_legs: false
    output_multiplier: 0.1
    enable_refine: false

  enable_lighting: true
  cfg_light:
    num_layers: 5
    hidden_size: 256
    amb_diff_minmax: [[0.0, 1.0], [0.5, 1.0]]

  cfg_additional:
    iter_leg_rotation_start: 300000


## Losses - Fauna defaults
cfg_loss:
  mask_loss_weight: 100.0
  mask_dt_loss_weight: 0.
  mask_inv_dt_loss_weight: 1000.0
  rgb_loss_weight: 1.
  dino_feat_im_loss_weight: 10.
  sdf_reg_decay_start_iter: 10000
  sdf_bce_reg_loss_weight: 0.
  sdf_gradient_reg_loss_weight: 0.1
  logit_loss_weight: 1.
  logit_loss_dino_feat_im_loss_multiplier: 50.
  arti_reg_loss_iter_range: [60000, inf]
  arti_reg_loss_weight: 0.2
  deform_reg_loss_weight: 10.
  logit_loss_dino_feat_im_loss_multiplier_dict: {0: 50., 300000: 500.}
  dino_feat_im_loss_weight_dict: {0: 10., 300000: 1.}
  logit_loss_mask_multiplier: 0.05
  logit_loss_mask_inv_dt_multiplier: 0.05
