# MagicPony Model Configuration for Mouse - A6000 Original Paper Settings
#
# Based on MagicPony (CVPR 2023) original hyperparameters:
# - Pretrained horse model: 140K iterations
# - Fine-tuning on new species: use original hyperparameters
#
# A6000 (48GB VRAM) enables full resolution training with grid_res=256
#
# Two training modes:
# 1. From Scratch: Full 140K iterations for mouse
# 2. Finetune: Start from pretrained horse, 100K additional iterations

defaults:
  - magicpony

name: MagicPony


## Model settings - FULL RESOLUTION (A6000)
cfg_predictor_base:
  cfg_shape:
    grid_res: 256  # Original full resolution
    grid_res_coarse_iter_range: [0, 100000]
    grid_res_coarse: 128


## Instance predictor - Original MagicPony defaults
cfg_predictor_instance:
  enable_deform: true
  cfg_deform:
    deform_iter_range: [90000, inf]  # Original MagicPony

  cfg_articulation:
    articulation_iter_range: [10000, inf]  # Original MagicPony
    num_body_bones: 8  # Original
    num_legs: 4
    num_leg_bones: 3
    legs_to_body_joint_indices: null  # Auto-detect
    constrain_legs: true
    extra_constraints: false
    use_fauna_constraints: false


## Losses - Original MagicPony defaults
cfg_loss:
  mask_loss_weight: 10.
  mask_dt_loss_weight: 0.
  mask_inv_dt_loss_weight: 100.
  rgb_loss_weight: 1.
  dino_feat_im_loss_weight: 10.
  sdf_bce_reg_loss_weight: 0.
  sdf_gradient_reg_loss_weight: 0.01
  logit_loss_weight: 1.
  arti_reg_loss_weight: 0.1
  deform_reg_loss_weight: 10.


## Optimizer - Original MagicPony defaults
cfg_optim_base:
  lr: 0.0001

cfg_optim_instance:
  lr: 0.0001
