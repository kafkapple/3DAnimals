# Fauna Training Configuration for Mouse Large Dataset (7200 images)
#
# Full training with large mouse dataset from sam3d_gui
# 72 videos × 100 frames = 7200 images

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base_fauna
  - dataset: mouse_large
  - model: fauna_mouse_6view  # Reuse mouse model config


# Training settings
run_train: true
run_test: true  # Save mesh visualizations after training
seed: 42
gpu: 0
num_iters: 200000  # 200K iterations for large dataset
shuffle_dataset_paths: false  # Avoid AttributeError with accelerate DataLoader

# Checkpoint settings
checkpoint_dir: results/fauna_mouse_large
save_checkpoint_freq: 1500  # Frequent saves to survive crashes
keep_num_checkpoint: 3  # Keep only recent 3 checkpoints (auto-delete old ones)
resume: true  # Resume from checkpoint if exists

# Visualization - save mesh/images during training
save_train_result_freq: 20000  # Save mesh every 20K iterations

# Logging - WandB enabled
use_logger: true
logger_type: wandb
wandb_project: Fauna_mouse
wandb_run_name: large_scratch_${now:%Y%m%d_%H%M%S}
log_image_freq: 1000
log_loss_freq: 50
