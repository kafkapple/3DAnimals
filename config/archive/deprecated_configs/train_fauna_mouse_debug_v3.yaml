# Fauna Mouse Debug v3 - Extreme Regularization
# Hypothesis: Keep spatial_scale=5, but use extreme regularization

hydra:
  run:
    dir: .
  output_subdir: results/fauna_mouse_debug_v3

defaults:
  - base_fauna
  - dataset: fauna
  - model: fauna
  - _self_

experiment:
  name: "fauna_mouse_debug_v3"
  description: "Debug v3 - extreme regularization (sdf_bce=50, gradient=20)"
  mode: "debug"
  seed: 42

pretrained:
  checkpoint_path: null
  freeze_encoder: false
  freeze_base_predictor: false
  freeze_texture: false
  freeze_articulation: false

dataset:
  data_type: fauna
  train_data_dir: "/home/joon/dev/3DAnimals/data/fauna_mouse"
  val_data_dir: "/home/joon/dev/3DAnimals/data/fauna_mouse"
  test_data_dir: "/home/joon/dev/3DAnimals/data/fauna_mouse"
  in_image_size: 256
  out_image_size: 256
  batch_size: 4
  num_workers: 4
  random_shuffle_samples_train: true
  random_xflip_train: true
  load_dino_feature: false
  dino_feature_dim: 16
  load_keypoint: false
  background_mode: none

model:
  name: Fauna
  spatial_scale: 5  # Keep original (test extreme reg)

  cfg_predictor_base:
    cfg_shape:
      grid_res: 64
      init_sdf: 'ellipsoid'
      pretrained_sdf: null

  cfg_predictor_instance:
    cfg_articulation:
      articulation_iter_range: [2000, inf]
      num_body_bones: 8
      body_bones_mode: z_minmax_y+
      num_legs: 4
      num_leg_bones: 3
      max_arti_angle: 90
      skinning_temperature: 0.05
      static_root_bones: false
      output_multiplier: 0.1
      attach_legs_to_body_iter_range: [4000, inf]
      legs_to_body_joint_indices: null
      constrain_legs: true
      enable_refine: false

    enable_deform: false
    cfg_deform:
      deform_iter_range: [150000, inf]

    cfg_texture:
      texture_iter_range: [0, inf]
      cout: 9
      num_layers: 8
      hidden_size: 256

cfg_optim_base:
  lr: 0.0005  # Reduce LR for stability
  weight_decay: 0.001

cfg_optim_instance:
  lr: 0.0005
  weight_decay: 0.001

cfg_optim_discriminator:
  lr: 0.0005
  weight_decay: 0.001

lr_scheduler:
  type: ExponentialLR
  gamma: 0.99995

cfg_loss:
  mask_loss_weight: 100.0
  mask_dt_loss_weight: 0.
  mask_inv_dt_loss_weight: 1000.0
  rgb_loss_weight: 1.0
  dino_feat_im_loss_weight: 10.0

  # EXTREME regularization
  sdf_bce_reg_loss_weight: 50.0  # 20→50
  sdf_gradient_reg_loss_weight: 20.0  # 5→20
  sdf_reg_decay_start_iter: 4500  # Keep until end

  arti_reg_loss_iter_range: [2000, inf]
  arti_reg_loss_weight: 0.5
  deform_reg_loss_weight: 20.0

  logit_loss_weight: 1.0
  logit_loss_dino_feat_im_loss_multiplier: 50.
  logit_loss_mask_multiplier: 0.05
  logit_loss_mask_inv_dt_multiplier: 0.05

  logit_loss_dino_feat_im_loss_multiplier_dict: {0: 50., 3000: 500.}
  dino_feat_im_loss_weight_dict: {0: 10., 3000: 1.}

run_train: true
run_test: false
num_iters: 5000
seed: 42
gpu: 0

save_checkpoint_freq: 1000
keep_num_checkpoint: 5
checkpoint_dir: results/fauna_mouse_debug_v3
checkpoint_path: null
load_optim: false
reset_epoch: false
resume: true

use_logger: true
logger_type: tensorboard
log_image_freq: 100
log_loss_freq: 20
log_train: true
log_val: true
save_train_result_freq: 2000

cfg_render:
  spatial_scale: 5
  background_mode: none
  render_flow: false
  cam_pos_z_offset: 10
  fov: 25
  renderer_spp: 1

cfg_mask_discriminator:
  enable_iter: [4000, 5000]

augmentation:
  random_flip: true
  random_scale_range: [0.9, 1.1]
  random_rotate_deg: 10
  color_jitter: 0.2
  random_crop: false

monitoring:
  early_stopping:
    enabled: false
    patience: 50000
    metric: "val_loss"
    min_delta: 0.001
  metrics:
    - mask_iou
    - rgb_psnr
    - dino_similarity
    - arti_reg_loss
    - total_loss

debug:
  visualize_every: 100
  save_intermediate_shapes: true
  verbose: true
