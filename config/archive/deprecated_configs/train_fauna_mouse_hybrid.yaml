# Fauna Mouse Hybrid Approach - Code Modification
# Purpose: Mouse-scale ellipsoid with minimal code changes
# Code change: dmtet.py + ellipsoid_scale_multiplier parameter

hydra:
  run:
    dir: .
  output_subdir: results/fauna_mouse_hybrid

defaults:
  - base_fauna
  - dataset: fauna
  - model: fauna
  - _self_

# ========== Experiment Info ==========
experiment:
  name: "fauna_mouse_hybrid"
  description: "Hybrid approach - Mouse-scale ellipsoid (ellipsoid_scale_multiplier=0.01)"
  mode: "debug"
  seed: 42

# ========== NO Pretrained Weights ==========
pretrained:
  checkpoint_path: null
  freeze_encoder: false
  freeze_base_predictor: false
  freeze_texture: false
  freeze_articulation: false

# ========== Dataset ==========
dataset:
  data_type: fauna
  train_data_dir: "/home/joon/dev/3DAnimals/data/fauna_mouse"
  val_data_dir: "/home/joon/dev/3DAnimals/data/fauna_mouse"
  test_data_dir: "/home/joon/dev/3DAnimals/data/fauna_mouse"

  in_image_size: 256
  out_image_size: 256

  batch_size: 4
  num_workers: 4

  random_shuffle_samples_train: true
  random_xflip_train: true
  load_dino_feature: false
  dino_feature_dim: 16
  load_keypoint: false

  background_mode: none

# ========== Model ==========
model:
  name: Fauna
  spatial_scale: 1.5  # HYBRID: Small scale for mouse

  cfg_predictor_base:
    cfg_shape:
      grid_res: 128  # Higher resolution for mouse details
      init_sdf: 'ellipsoid'
      pretrained_sdf: null
      ellipsoid_scale_multiplier: 0.01  # ⭐ KEY PARAMETER: Mouse-specific (vs 0.15 for horse)

  cfg_predictor_instance:
    cfg_articulation:
      articulation_iter_range: [2000, inf]
      num_body_bones: 8
      body_bones_mode: z_minmax_y+
      num_legs: 4
      num_leg_bones: 3
      max_arti_angle: 90
      skinning_temperature: 0.05
      static_root_bones: false
      output_multiplier: 0.1
      attach_legs_to_body_iter_range: [4000, inf]
      legs_to_body_joint_indices: null
      constrain_legs: true
      enable_refine: false

    enable_deform: false
    cfg_deform:
      deform_iter_range: [150000, inf]

    cfg_texture:
      texture_iter_range: [0, inf]
      cout: 9
      num_layers: 8
      hidden_size: 256

# ========== Optimizer ==========
cfg_optim_base:
  lr: 0.0005  # Reduced for stability
  weight_decay: 0.001

cfg_optim_instance:
  lr: 0.0005
  weight_decay: 0.001

cfg_optim_discriminator:
  lr: 0.0005
  weight_decay: 0.001

lr_scheduler:
  type: ExponentialLR
  gamma: 0.99995

# ========== Losses ==========
cfg_loss:
  # Reconstruction
  mask_loss_weight: 100.0
  mask_dt_loss_weight: 0.
  mask_inv_dt_loss_weight: 1000.0
  rgb_loss_weight: 1.0
  dino_feat_im_loss_weight: 10.0

  # SDF Regularization (Strong but not extreme)
  sdf_bce_reg_loss_weight: 30.0  # Stronger than horse (0.0) but not extreme (50.0)
  sdf_gradient_reg_loss_weight: 10.0  # Stronger for mouse scale
  sdf_reg_decay_start_iter: 4000  # Keep strong regularization

  # Articulation
  arti_reg_loss_iter_range: [2000, inf]
  arti_reg_loss_weight: 0.5

  # Deformation
  deform_reg_loss_weight: 20.0

  # Logit loss
  logit_loss_weight: 1.0
  logit_loss_dino_feat_im_loss_multiplier: 50.
  logit_loss_mask_multiplier: 0.05
  logit_loss_mask_inv_dt_multiplier: 0.05

  # Progressive loss weights
  logit_loss_dino_feat_im_loss_multiplier_dict: {0: 50., 3000: 500.}
  dino_feat_im_loss_weight_dict: {0: 10., 3000: 1.}

# ========== Training ==========
run_train: true
run_test: false
num_iters: 5000  # DEBUG MODE: Quick validation
seed: 42
gpu: 0

# Checkpointing
save_checkpoint_freq: 1000
keep_num_checkpoint: 5
checkpoint_dir: results/fauna_mouse_hybrid
checkpoint_path: null
load_optim: false
reset_epoch: false
resume: true

# Logging
use_logger: true
logger_type: tensorboard
log_image_freq: 100
log_loss_freq: 20
log_train: true
log_val: true
save_train_result_freq: 2000

# ========== Rendering ==========
cfg_render:
  spatial_scale: 1.5  # Match model spatial_scale
  background_mode: none
  render_flow: false
  cam_pos_z_offset: 10
  fov: 25
  renderer_spp: 1

# ========== Discriminator ==========
cfg_mask_discriminator:
  enable_iter: [4000, 5000]

# ========== Augmentation ==========
augmentation:
  random_flip: true
  random_scale_range: [0.9, 1.1]
  random_rotate_deg: 10
  color_jitter: 0.2
  random_crop: false

# ========== Monitoring ==========
monitoring:
  early_stopping:
    enabled: false
    patience: 50000
    metric: "val_loss"
    min_delta: 0.001

  metrics:
    - mask_iou
    - rgb_psnr
    - dino_similarity
    - arti_reg_loss
    - total_loss

# ========== Debugging ==========
debug:
  visualize_every: 100
  save_intermediate_shapes: true
  verbose: true

# ========== HYBRID APPROACH NOTES ==========
# Code modification (dmtet.py):
#   Line 247-249: Support ellipsoid_scale_multiplier parameter
#   Line 184: Store ellipsoid_scale_multiplier in __init__
#
# Expected ellipsoid calculation:
#   spatial_scale: 1.5
#   ellipsoid_scale_multiplier: 0.01
#   ellipsoid_radius = 1.5 × 0.01 = 0.015m = 1.5cm
#   mouse_height = 7.5cm
#   ratio = 1.5cm / 7.5cm = 0.2 ✅ Reasonable!
#
# Voxel size:
#   grid_res: 128
#   voxel_size = 1.5 / 128 = 0.012m = 1.2cm
#   mouse_leg_width = 0.5cm
#   voxels_per_leg = 0.5cm / 1.2cm = 0.42 voxels (still sub-voxel)
#
# Success criteria:
#   - Survive > 10 iterations (vs baseline 7 iters)
#   - SDF gradient_reg stays < 10.0
#   - No immediate mesh collapse
#
# If successful → Run full training (200K iters)
