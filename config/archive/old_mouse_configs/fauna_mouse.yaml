defaults:
  - fauna  # inherit from fauna config

name: FaunaMouse
# Mouse-specific model configuration with pre-trained SDF prior

## Base predictor - Mouse-specific settings
cfg_predictor_base:
  cfg_shape:
    grid_res: 128  # Smaller than default 256 for mouse
    grid_res_coarse_iter_range: [0, 300000]
    grid_res_coarse: 64
    spatial_scale: 5.0  # Smaller than default 7.0 for mouse scale
    num_layers: 5
    hidden_size: 64  # Smaller than default 256
    embedder_freq: 8
    embed_concat_pts: true
    init_sdf: null  # Disable default initialization
    pretrained_sdf: checkpoints/mouse_sdf_pretrained.pth  # Use MAMMAL mouse prior
    jitter_grid: 0.05
    symmetrize: true

  cfg_dino:
    feature_dim: 16
    num_layers: 5
    hidden_size: 64  # Smaller than default 256
    activation: sigmoid
    embedder_freq: 8
    embed_concat_pts: true
    symmetrize: false
    minmax: [0., 1.]

  cfg_bank:
    memory_bank_size: 30  # Smaller than default 60

## Instance predictor - Keep most settings but adjust scale
cfg_predictor_instance:
  spatial_scale: 5.0  # Match base predictor

  cfg_texture:
    texture_iter_range: [0, inf]
    cout: 9
    num_layers: 6  # Smaller than default 8
    hidden_size: 128  # Smaller than default 256
    activation: sigmoid
    kd_minmax: [[0., 1.], [0., 1.], [0., 1.]]
    embed_concat_pts: true
    embedder_freq: 10
    symmetrize: true

  cfg_pose:
    architecture: encoder_dino_patch_key
    cam_pos_z_offset: ${...cfg_render.cam_pos_z_offset}
    fov: ${...cfg_render.fov}
    max_trans_xy_range_ratio: 0.2
    max_trans_z_range_ratio: 0.5
    rot_rep: quadlookat
    rot_temp_scalar: 1
    naive_probs_iter: 2000
    best_pose_start_iter: 6000
    lookat_zeroy: true

  # Deformation settings - enable earlier for mouse
  enable_deform: true
  cfg_deform:
    deform_iter_range: [400000, inf]  # Earlier than default 800000
    num_layers: 4  # Smaller than default 5
    hidden_size: 128  # Smaller than default 256
    embed_concat_pts: true
    embedder_freq: 10
    symmetrize: true

  # Articulation settings - mouse-specific skeleton
  enable_articulation: true
  cfg_articulation:
    articulation_iter_range: [20000, inf]
    architecture: attention
    num_layers: 4
    hidden_size: 128  # Smaller than default 256
    embedder_freq: 8
    bone_feature_mode: sample+global
    num_body_bones: 6  # Fewer than default 8 for mouse
    body_bones_mode: z_minmax_y+
    num_legs: 4  # Mouse has 4 legs
    num_leg_bones: 3
    attach_legs_to_body_iter_range: [60000, inf]
    legs_to_body_joint_indices: null
    static_root_bones: false
    skinning_temperature: 0.05
    max_arti_angle: 60
    constrain_legs: false
    output_multiplier: 0.1
    enable_refine: false

  enable_lighting: true
  cfg_light:
    num_layers: 4  # Smaller than default 5
    hidden_size: 128  # Smaller than default 256
    amb_diff_minmax: [[0.0, 1.0], [0.5, 1.0]]

  cfg_additional:
    iter_leg_rotation_start: 200000  # Earlier than default 300000

## Rendering - Adjust for mouse scale
cfg_render:
  spatial_scale: 5.0  # Smaller than default 7.0
  background_mode: none
  render_flow: false
  cam_pos_z_offset: 10
  fov: 25
  renderer_spp: 1
