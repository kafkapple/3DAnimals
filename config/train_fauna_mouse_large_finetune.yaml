# Fauna Fine-tuning from Pretrained for Mouse Large Dataset
#
# Use pretrained Fauna (128 species) and fine-tune on mouse large dataset

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base_fauna
  - dataset: mouse_large
  - model: fauna_mouse_6view


# Fine-tuning settings
run_train: true
run_test: true  # Save mesh visualizations after training
seed: 42
gpu: 1
disable_tf32: true
num_iters: 100000  # 100K iterations for fine-tuning
shuffle_dataset_paths: false  # Avoid AttributeError with accelerate DataLoader

# Checkpoint - START FROM PRETRAINED
checkpoint_dir: results/fauna_mouse_large_finetune
save_checkpoint_freq: 1500  # Frequent saves to survive crashes
keep_num_checkpoint: 3  # Keep only recent 3 checkpoints (auto-delete old ones)
resume: results/fauna/pretrained_fauna/pretrained_fauna.pth  # Pretrained model!

# Visualization - save mesh/images during training
save_train_result_freq: 10000  # Save mesh every 10K iterations

# Logging - WandB enabled
use_logger: true
logger_type: wandb
wandb_project: Fauna_mouse
wandb_run_name: large_finetune_${now:%Y%m%d_%H%M%S}
log_image_freq: 1000
log_loss_freq: 50
