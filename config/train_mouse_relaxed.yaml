# Mouse Relaxed Training Configuration
# Testing constraint relaxation for extended training

defaults:
- dataset: mouse
- model: mouse_relaxed  # Use relaxed config
- _self_

exp_name: mouse_relaxed
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}

num_iters: 200  # Test if we can exceed 30 iterations
save_checkpoint_freq: 50
log_image_freq: 20

device: cuda
gpu_ids:
- 0
disable_tf32: true

wandb:
  project: mouse_fauna
  mode: offline
  tags:
  - mouse
  - relaxed_constraints
  - extended_training

output_dir: results/${exp_name}
resume: null  # Train from scratch with pretrained SDF
seed: 42

run_train: true
run_test: false
keep_num_checkpoint: 5
