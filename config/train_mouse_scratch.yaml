# Mouse From Scratch Training Configuration
# Train from scratch with ultra-relaxed constraints

defaults:
- dataset: mouse
- model: mouse_scratch
- _self_

exp_name: mouse_scratch
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}

num_iters: 200  # Aim for 100+
save_checkpoint_freq: 50
log_image_freq: 20

device: cuda
gpu_ids:
- 0
disable_tf32: true

wandb:
  project: mouse_fauna
  mode: offline
  tags:
  - mouse
  - from_scratch
  - grid_res_64
  - ultra_relaxed

output_dir: results/${exp_name}
resume: null
seed: 42

run_train: true
run_test: false
keep_num_checkpoint: 5
