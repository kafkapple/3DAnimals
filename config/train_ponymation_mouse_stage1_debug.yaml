# Ponymation Mouse Stage 1 Debug Training
# 빠른 검증용 (2K iterations)
#
# Usage:
#   python run.py --config-name train_ponymation_mouse_stage1_debug

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: sequence
  - model: ponymation_mouse_scratch


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 1
  num_frames: 10
  train_data_dir: data/ponymation/mouse/train
  val_data_dir: data/ponymation/mouse/test
  random_shuffle_samples_train: true
  load_dino_feature: true
  dino_feature_dim: 16


model:
  enable_render: true
  cfg_render:
    render_default: false
  cfg_predictor_base:
    cfg_shape:
      grid_res_coarse_iter_range: [0, inf]
  cfg_predictor_instance:
    enable_motion_vae: false
    enable_deform: false
  cfg_loss:
    artivel_smooth_loss_weight: 1


run_train: true
run_test: false
seed: 0
gpu: 1
disable_tf32: true
num_iters: 2000
save_checkpoint_freq: 500
log_image_freq: 100
checkpoint_dir: results/ponymation/mouse_stage1_debug
resume: false
use_logger: true
logger_type: wandb
wandb_project: Ponymation_mouse
wandb_run_name: stage1_scratch_debug_${now:%Y%m%d_%H%M%S}
