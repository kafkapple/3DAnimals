defaults:
- dataset: mouse
- model: mouse_stage1
- _self_

exp_name: mouse_stage1
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}
num_iters: 150
save_checkpoint_freq: 50
log_image_freq: 20
