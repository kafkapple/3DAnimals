hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: image
  - model: magicpony_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 8
  train_data_dir: data/magicpony/mouse/train
  val_data_dir: data/magicpony/mouse/val
  random_shuffle_samples_train: true
  load_dino_feature: false  # DINO features not pre-extracted
  dino_feature_dim: 16


run_train: true
run_test: false
seed: 0
gpu: 0
num_iters: 100000
checkpoint_dir: results/magicpony/mouse
save_checkpoint_freq: 2000
resume: true
use_logger: true
logger_type: wandb
wandb_project: MagicPony_mouse
wandb_run_name: scratch_${now:%Y%m%d_%H%M%S}
