# Mouse Stable Training Configuration
# 강화된 SDF regularization으로 mesh collapse 방지

hydra:
  run:
    dir: .
  output_subdir: ${output_dir}

defaults:
  - dataset: mouse
  - model: mouse_stable
  - _self_

exp_name: mouse_stable
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}

# Training iterations
num_iters: 200000
save_checkpoint_freq: 5000
log_image_freq: 500

# Device
device: cuda
gpu_ids: [0]
disable_tf32: true

# Logging
wandb:
  project: mouse_fauna
  mode: offline
  tags:
    - mouse
    - stable

output_dir: results/${exp_name}
resume: null
seed: 42
run_train: true
run_test: false
keep_num_checkpoint: 5
