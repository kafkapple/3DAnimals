# Mouse Ultimate Training Configuration
# Testing grid_res=64 + all optimizations

defaults:
- dataset: mouse
- model: mouse_ultimate
- _self_

exp_name: mouse_ultimate
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}

num_iters: 200  # Test extended training
save_checkpoint_freq: 50
log_image_freq: 20

device: cuda
gpu_ids:
- 0
disable_tf32: true

wandb:
  project: mouse_fauna
  mode: offline
  tags:
  - mouse
  - ultimate
  - grid_res_64

output_dir: results/${exp_name}
resume: null
seed: 42

run_train: true
run_test: false
keep_num_checkpoint: 5
