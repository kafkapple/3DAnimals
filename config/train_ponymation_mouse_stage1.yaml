# Ponymation Mouse Stage 1 Training
# Stage 1: Articulation 학습 (MagicPony 체크포인트에서 시작)
#
# Usage:
#   python run.py --config-name train_ponymation_mouse_stage1
#
# Prerequisites:
#   - MagicPony mouse 체크포인트 필요 (results/magicpony/mouse/checkpoint.pth)
#   - data/ponymation/mouse/train/ 에 시퀀스 데이터 준비

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: sequence
  - model: ponymation_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 1  # Stage 1은 메모리 집약적
  num_frames: 10
  train_data_dir: data/ponymation/mouse/train
  val_data_dir: data/ponymation/mouse/test
  random_shuffle_samples_train: true
  load_dino_feature: false  # DINO 특징 미생성
  dino_feature_dim: 16


model:
  enable_render: true
  cfg_predictor_base:
    cfg_shape:
      grid_res_coarse_iter_range: [0, inf]  # 항상 coarse 유지
  cfg_predictor_instance:
    enable_motion_vae: false  # Stage 1에서는 VAE 비활성화
    enable_deform: false
  cfg_loss:
    artivel_smooth_loss_weight: 1  # 관절 속도 스무딩


run_train: true
run_test: false
seed: 0
gpu: 0
num_iters: 10000
save_checkpoint_freq: 2000
checkpoint_dir: results/ponymation/mouse_stage1
# checkpoint_path: results/magicpony/mouse/checkpoint.pth  # MagicPony에서 시작 (주석 해제 필요)
resume: true
load_optim: false
use_logger: false
