# Mouse Debug Training Configuration
# Auto-generated by prepare_fauna_dataset.py
# Duration: ~15-20 minutes (5K iterations)
hydra:
    run:
      dir: .
    output_subdir: ${output_dir}
defaults:
- dataset: mouse
- model: mouse
- _self_
exp_name: mouse_debug
run_name: ${exp_name}_${now:%Y%m%d_%H%M%S}
num_iters: 200  # Extended test: see how far we can go
save_checkpoint_freq: 50
log_image_freq: 20
device: cuda
gpu_ids:
- 0
disable_tf32: true
wandb:
  project: mouse_fauna
  mode: online
  tags:
  - mouse
  - debug
output_dir: results/${exp_name}
resume: null  # Train from scratch with DANNCE config
seed: 42
run_train: true
run_test: false
keep_num_checkpoint: 5
