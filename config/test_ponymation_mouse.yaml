# Ponymation Mouse Inference Config
#
# Run inference on trained Ponymation mouse model (Stage 2)
#
# Usage:
#   # Using pretrained horse Stage 2 (default - for comparison)
#   python run.py --config-name test_ponymation_mouse
#
#   # Using trained Stage 2 model (when available)
#   python run.py --config-name test_ponymation_mouse \
#     checkpoint_dir=results/ponymation/mouse_finetune_stage2 \
#     checkpoint_name=checkpoint.pth
#
#   # Using Stage 1 debug checkpoint
#   python run.py --config-name test_ponymation_mouse \
#     checkpoint_dir=results/ponymation/mouse_finetune_stage1_debug \
#     checkpoint_name=checkpoint.pth

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: sequence
  - model: ponymation_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 10
  num_frames: 1
  test_data_dir: data/ponymation/mouse/test
  load_dino_feature: false
  dino_feature_dim: 16


run_train: false
run_test: true

# Wandb logging
use_logger: true
logger_type: wandb
wandb_project: Ponymation_mouse
wandb_run_name: test_${now:%Y%m%d_%H%M%S}

# Default: pretrained horse Stage 2 (for comparison/baseline)
# Change to mouse checkpoint when trained
checkpoint_dir: results/ponymation/pretrained_horse
checkpoint_name: pretrained_horse_stage2.pth


# Visualization settings
output_dir: results/ponymation/mouse_visualization
render_modes: [input_view, other_views, rotation]
finetune_texture: false
finetune_iters: 10
finetune_lr: 0.001
evaluate_keypoint: false
