# Ponymation Mouse Stage 1 Fine-tuning Debug Mode
#
# Quick validation of Stage 1 fine-tuning (~10-15 minutes)
#
# Prerequisites:
#   - MagicPony checkpoint (horse pretrained or mouse finetuned)
#   - Ponymation mouse data at data/ponymation/mouse/
#
# Usage:
#   python run.py --config-name finetune_ponymation_mouse_stage1_debug

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: sequence
  - model: ponymation_mouse


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 1
  num_frames: 10
  train_data_dir: data/ponymation/mouse/train
  val_data_dir: data/ponymation/mouse/test
  random_shuffle_samples_train: true
  load_dino_feature: false
  dino_feature_dim: 16


model:
  enable_render: true
  cfg_predictor_base:
    cfg_shape:
      grid_res_coarse_iter_range: [0, inf]
  cfg_predictor_instance:
    enable_motion_vae: false
    enable_deform: false
  cfg_loss:
    artivel_smooth_loss_weight: 1


run_train: true
run_test: false
seed: 42
gpu: 0
num_iters: 2000  # Debug: 2K iterations
save_checkpoint_freq: 500
log_image_freq: 100
log_loss_freq: 20

# MagicPony checkpoint
checkpoint_path: results/magicpony/pretrained_horse/pretrained_horse.pth
checkpoint_dir: results/ponymation/mouse_finetune_stage1_debug
resume: true
load_optim: false

use_logger: true
logger_type: wandb
wandb_project: Ponymation_mouse
wandb_run_name: stage1_finetune_debug_${now:%Y%m%d_%H%M%S}
