# Ponymation Mouse Stage 2 Fine-tuning
#
# Stage 2: Motion VAE training from Stage 1 checkpoint
#
# Training Flow:
#   MagicPony → Ponymation Stage 1 → Ponymation Stage 2 (this config)
#
# Prerequisites:
#   - Stage 1 checkpoint: results/ponymation/mouse_finetune_stage1/checkpoint.pth
#
# Usage:
#   python run.py --config-name finetune_ponymation_mouse_stage2

hydra:
  run:
    dir: .
  output_subdir: ${checkpoint_dir}


defaults:
  - base
  - dataset: sequence
  - model: ponymation  # Use original ponymation model (not ponymation_mouse)


dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 4  # Stage 2: 더 큰 배치 가능
  num_frames: 10
  train_data_dir: data/ponymation/mouse/train
  val_data_dir: data/ponymation/mouse/test
  random_shuffle_samples_train: true
  load_dino_feature: false
  dino_feature_dim: 16


model:
  enable_render: false  # Stage 2: 렌더링 비활성화 (속도 향상)
  cfg_predictor_base:
    cfg_shape:
      grid_res_coarse_iter_range: [0, inf]
  cfg_predictor_instance:
    enable_motion_vae: true  # Stage 2: VAE 활성화
    enable_deform: true
  cfg_loss:
    # Visual losses 비활성화
    mask_loss_weight: 0.
    mask_dt_loss_weight: 0.
    mask_inv_dt_loss_weight: 0.
    rgb_loss_weight: 0.
    dino_feat_im_loss_weight: 0.
    logit_loss_weight: 0.
    sdf_bce_reg_loss_weight: 0.
    sdf_gradient_reg_loss_weight: 0.
    arti_reg_loss_weight: 0.
    deform_reg_loss_weight: 0.
    artivel_smooth_loss_weight: 0.
    # VAE losses 활성화
    arti_recon_loss_weight: 100.0
    kld_loss_weight: 0.001


run_train: true
run_test: false
seed: 42
gpu: 1
num_iters: 100000  # Stage 2: 100K (마우스용 축소)
save_checkpoint_freq: 5000
keep_num_checkpoint: 3

# Stage 2 saves results here
checkpoint_dir: results/ponymation/mouse_finetune_stage2
# checkpoint_path: set via train_unified.sh or command line override
# e.g., checkpoint_path=results/ponymation/mouse_finetune_stage1/checkpoint.pth
resume: true
reset_epoch: true  # Reset iteration counter for Stage 2
load_optim: false

# Logging
use_logger: true
logger_type: wandb
wandb_project: Ponymation_mouse
wandb_run_name: stage2_finetune_${now:%Y%m%d_%H%M%S}
log_image_freq: 1000
log_loss_freq: 50

# Memory optimization
mixed_precision: fp16
